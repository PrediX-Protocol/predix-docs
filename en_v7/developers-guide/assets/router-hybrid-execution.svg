<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" font-family="Inter, system-ui, sans-serif">
  <rect x="0" y="0" width="760" height="240" rx="12" fill="#ffffff"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
  </defs>

  <!-- User -->
  <rect x="20" y="80" width="100" height="48" rx="24" fill="#2563eb"/>
  <text x="70" y="110" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">User</text>

  <!-- Arrow user → router -->
  <line x1="120" y1="104" x2="170" y2="104" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="145" y="96" text-anchor="middle" font-size="10" fill="#64748b">buyYes()</text>

  <!-- Router -->
  <rect x="175" y="72" width="140" height="64" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="245" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">Smart Router</text>
  <text x="245" y="118" text-anchor="middle" font-size="10" fill="#8b5cf6">Stateless aggregator</text>

  <!-- Split -->
  <line x1="315" y1="90" x2="380" y2="55" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="315" y1="118" x2="380" y2="155" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- CLOB -->
  <rect x="385" y="28" width="170" height="52" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="470" y="50" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">CLOB (Exchange)</text>
  <text x="470" y="68" text-anchor="middle" font-size="10" fill="#64748b">99-tick order book · best price first</text>

  <!-- AMM -->
  <rect x="385" y="130" width="170" height="52" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="470" y="152" text-anchor="middle" font-size="13" font-weight="600" fill="#134e4a">AMM (Uniswap v4)</text>
  <text x="470" y="170" text-anchor="middle" font-size="10" fill="#64748b">Hook · dynamic fees · anti-MEV</text>

  <!-- Merge -->
  <line x1="555" y1="55" x2="620" y2="90" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="555" y1="155" x2="620" y2="118" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Output -->
  <rect x="625" y="80" width="120" height="48" rx="24" fill="#16a34a"/>
  <text x="685" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">YES / NO</text>
  <text x="685" y="116" text-anchor="middle" font-size="10" fill="#bbf7d0">tokens out</text>

  <!-- Labels -->
  <text x="350" y="42" text-anchor="middle" font-size="10" fill="#2563eb" font-weight="500">Priority</text>
  <text x="350" y="168" text-anchor="middle" font-size="10" fill="#0d9488" font-weight="500">Fallback</text>

  <!-- Bottom note -->
  <text x="380" y="215" text-anchor="middle" font-size="11" fill="#334155" font-weight="500">Single atomic transaction · Unused input refunded · balanceOf(router) == 0</text>
</svg>
