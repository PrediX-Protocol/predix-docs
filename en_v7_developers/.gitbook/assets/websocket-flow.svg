<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" font-family="Inter, system-ui, sans-serif">
  <rect x="0" y="0" width="700" height="280" rx="12" fill="#ffffff"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
  </defs>

  <!-- Client -->
  <rect x="30" y="30" width="140" height="220" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="100" y="55" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">Client</text>

  <!-- Server -->
  <rect x="530" y="30" width="140" height="220" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="600" y="55" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">Server</text>

  <!-- Connect -->
  <line x1="170" y1="80" x2="530" y2="80" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="250" y="66" width="200" height="24" rx="4" fill="#dbeafe"/>
  <text x="350" y="83" text-anchor="middle" font-size="11" font-weight="500" fill="#1e40af">ws://host/ws/realtime</text>

  <!-- Subscribe -->
  <line x1="170" y1="120" x2="530" y2="120" stroke="#0d9488" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="230" y="106" width="240" height="24" rx="4" fill="#f0fdfa"/>
  <text x="350" y="123" text-anchor="middle" font-size="11" font-weight="500" fill="#134e4a">{ subscribe: "orderbook", marketId: 1 }</text>

  <!-- Subscribed ack -->
  <line x1="530" y1="155" x2="170" y2="155" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="270" y="141" width="160" height="24" rx="4" fill="#dcfce7"/>
  <text x="350" y="158" text-anchor="middle" font-size="11" font-weight="500" fill="#15803d">{ type: "subscribed" }</text>

  <!-- Data push -->
  <line x1="530" y1="190" x2="170" y2="190" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="240" y="176" width="220" height="24" rx="4" fill="#f5f3ff"/>
  <text x="350" y="193" text-anchor="middle" font-size="11" font-weight="500" fill="#5b21b6">{ data: orderbook update }</text>

  <!-- Ping/Pong -->
  <line x1="530" y1="225" x2="170" y2="225" stroke="#64748b" stroke-width="1" stroke-dasharray="4"/>
  <line x1="170" y1="235" x2="530" y2="235" stroke="#64748b" stroke-width="1" stroke-dasharray="4"/>
  <text x="350" y="222" text-anchor="middle" font-size="10" fill="#94a3b8">ping</text>
  <text x="350" y="246" text-anchor="middle" font-size="10" fill="#94a3b8">pong</text>
</svg>
