<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" font-family="Inter, system-ui, sans-serif">
  <rect x="0" y="0" width="800" height="200" rx="12" fill="#ffffff"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
  </defs>

  <!-- Step 1 -->
  <rect x="20" y="50" width="130" height="52" rx="10" fill="#2563eb"/>
  <text x="85" y="72" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">1. Setup</text>
  <text x="85" y="88" text-anchor="middle" font-size="10" fill="#93c5fd">Connect wallet</text>

  <!-- Arrow -->
  <line x1="150" y1="76" x2="180" y2="76" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 2 -->
  <rect x="185" y="50" width="130" height="52" rx="10" fill="#475569"/>
  <text x="250" y="72" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">2. Approve</text>
  <text x="250" y="88" text-anchor="middle" font-size="10" fill="#94a3b8">USDC → Permit2</text>

  <line x1="315" y1="76" x2="345" y2="76" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 3 -->
  <rect x="350" y="50" width="130" height="52" rx="10" fill="#475569"/>
  <text x="415" y="72" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">3. Quote</text>
  <text x="415" y="88" text-anchor="middle" font-size="10" fill="#94a3b8">quoteBuyYes()</text>

  <line x1="480" y1="76" x2="510" y2="76" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 4 -->
  <rect x="515" y="50" width="130" height="52" rx="10" fill="#475569"/>
  <text x="580" y="72" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">4. Trade</text>
  <text x="580" y="88" text-anchor="middle" font-size="10" fill="#94a3b8">buyYes()</text>

  <line x1="645" y1="76" x2="675" y2="76" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 5 -->
  <rect x="680" y="50" width="100" height="52" rx="10" fill="#16a34a"/>
  <text x="730" y="72" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">5. Done</text>
  <text x="730" y="88" text-anchor="middle" font-size="10" fill="#bbf7d0">YES tokens</text>

  <!-- Bottom note -->
  <text x="400" y="140" text-anchor="middle" font-size="12" fill="#334155" font-weight="500">Router handles CLOB → AMM routing automatically in 1 transaction</text>
  <text x="400" y="160" text-anchor="middle" font-size="11" fill="#94a3b8">Unused USDC refunded · Failed tx = zero gas on Unichain</text>
</svg>
